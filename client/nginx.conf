server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Mirrors the dev-time Vite proxy (client/vite.config.ts) so the built
  # client can call relative /api and /uploads paths in production too —
  # "server" is the docker-compose service name.
  location /api/ {
    proxy_pass http://server:4000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://server:4000;
  }

  # SPA fallback so client-side routes (e.g. /challenges/abc) don't 404 on refresh.
  location / {
    try_files $uri /index.html;
  }
}
